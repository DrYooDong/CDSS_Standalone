<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDSS Platform Suite — Hệ Thống Hỗ Trợ Quyết Định Lâm Sàng Độc Lập</title>
  <meta name="description" content="Bộ công cụ CDSS hỗ trợ quyết định lâm sàng độc lập chuyên sâu: Dengue, ECG, ABG, Sinh Hóa Gan, SEPSIS, Liều Kháng Sinh, Vancomycin, Insulin Nội Viện, Khám Bệnh Nội Trú, Phân Tích Dịch Não Tủy CSF.">
  <meta property="og:title" content="CDSS Platform Suite — Hệ Thống Hỗ Trợ Quyết Định Lâm Sàng Độc Lập" />
  <meta property="og:description" content="Bộ công cụ CDSS hỗ trợ quyết định lâm sàng độc lập chuyên sâu: Dengue, ECG, ABG, Sinh Hóa Gan, SEPSIS, Liều Kháng Sinh, Vancomycin, Insulin Nội Viện, Khám Bệnh Nội Trú, Phân Tích Dịch Não Tủy CSF." />
  <meta property="og:type" content="website" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="icon" type="image/svg+xml" href="./shared/cdss-logo.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  
  <!-- Instant Theme Sync (Auto Light Mode Default & Universal Synchronization) -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var urlTheme = params.get('theme');
        var saved = urlTheme || localStorage.getItem('cliniportal_theme') || localStorage.getItem('clinical_theme') || localStorage.getItem('theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  
  <!-- CliniPortal CDSS Shell Styles & Theme Script -->
  <link rel="stylesheet" href="./shared/cdss-shell.css">
  <link rel="stylesheet" href="./css/cdss-hub.css?v=3.2.0">
  <script src="./shared/cdss-shell.js"></script>
</head>
<body>
  <!-- Standardized Master Top Navigation Bar (HepaCDSS Style) -->
  <header class="cdss-portal-navbar">
    <div class="cdss-portal-nav-breadcrumbs">
      <a href="./index.html" class="cdss-brand-link">
        <div class="cdss-brand-icon">
          <img src="./shared/cdss-logo.svg" alt="CDSS Logo" class="cdss-brand-logo-img" style="width:24px; height:24px; display:block;" />
        </div>
        <span class="cdss-brand-name">CDSS Platform</span>
      </a>
      <i class="fa-solid fa-chevron-right separator"></i>
      <span class="active"><i class="fa-solid fa-shapes text-teal-600"></i> 10 CDSS Lâm Sàng</span>
    </div>

    <div class="cdss-portal-nav-right">
      <button id="nav-calc-btn" class="cdss-portal-nav-btn cdss-portal-icon-btn" title="Máy tính lâm sàng cấp tốc (Alt+C)" aria-label="Máy tính lâm sàng">
        <i class="fa-solid fa-calculator"></i>
      </button>
      <button id="nav-stat-btn" class="cdss-portal-nav-btn cdss-portal-icon-btn" title="Lọc tình huống cấp cứu STAT (Alt+S)" aria-label="Cấp cứu STAT">
        <i class="fa-solid fa-bolt-lightning text-rose-500"></i>
      </button>
      <button id="nav-shortcuts-btn" class="cdss-portal-nav-btn cdss-portal-icon-btn" title="Phím tắt thao tác nhanh (?)" aria-label="Phím tắt">
        <i class="fa-solid fa-keyboard"></i>
      </button>
      <button id="theme-toggle" class="cdss-portal-theme-btn" title="Chuyển chế độ Sáng/Tối" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- CDSS Hub Application Mount Container -->
  <main id="cdss-hub-app"></main>

  <!-- CDSS Hub Application Bundle (Pre-bundled IIFE) -->
  <script src="./cdss-hub-bundle.js?v=3.2.0"></script>
</body>
</html>
