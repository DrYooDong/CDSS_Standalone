<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cdssGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cdssGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cdssGradShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.8" />
    </linearGradient>
    <filter id="cdssGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d9488" flood-opacity="0.3" />
    </filter>
    <filter id="cdssInnerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Clinical Shield with Soft Shadow -->
  <path d="M 60 6 L 104 28 C 104 68 84 100 60 114 C 36 100 16 68 16 28 Z"
        fill="url(#cdssGradPrimary)"
        filter="url(#cdssGlow)" />

  <!-- Inner Protective Layer -->
  <path d="M 60 14 L 96 32 C 96 66 78 94 60 106 C 42 94 24 66 24 32 Z"
        fill="#041e28"
        opacity="0.85" />

  <!-- Subtle Medical Grid Background -->
  <circle cx="60" cy="58" r="32" stroke="url(#cdssGradAccent)" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
  <circle cx="60" cy="58" r="22" stroke="url(#cdssGradAccent)" stroke-width="0.75" opacity="0.25" />

  <!-- Medical Cross / Clinical Node Base -->
  <g filter="url(#cdssInnerShadow)">
    <!-- Vertical Cross Stem -->
    <rect x="54" y="32" width="12" height="52" rx="4" fill="url(#cdssGradAccent)" />
    <!-- Horizontal Cross Bar -->
    <rect x="34" y="52" width="52" height="12" rx="4" fill="url(#cdssGradAccent)" />
  </g>

  <!-- Dynamic ECG Rhythm Pulse Overlay -->
  <path d="M 28 58 L 44 58 L 49 50 L 53 70 L 60 38 L 67 76 L 71 52 L 76 58 L 92 58"
        stroke="#ffffff"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Pulsing Decision Intelligence Nodes -->
  <circle cx="60" cy="38" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="60" cy="58" r="2.5" fill="#ffffff" />
  <circle cx="34" cy="58" r="2.5" fill="#14b8a6" />
  <circle cx="86" cy="58" r="2.5" fill="#38bdf8" />
  <circle cx="60" cy="80" r="2.5" fill="#14b8a6" />
</svg>
