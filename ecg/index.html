<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECG Master — Phân Tích Điện Tâm Đồ 12 Chuyển Đạo & AI Chẩn Đoán | CliniPortal CDSS</title>
  <meta name="description" content="Chuyên khảo và hệ thống phân tích điện tâm đồ 12 chuyển đạo theo trường phái BS Nguyễn Tôn Kinh Thi & ECG Made Easy, AI chẩn đoán, thước Caliper, định khu STEMI và tình huống lâm sàng mẫu.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Instant Theme Sync (Auto Light Mode Default & Universal Synchronization) -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var urlTheme = params.get('theme');
        var saved = urlTheme || localStorage.getItem('cliniportal_theme') || localStorage.getItem('clinical_theme') || localStorage.getItem('theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- CliniPortal CDSS Shell Styles & Theme Script -->
  <link rel="stylesheet" href="../shared/cdss-shell.css">
  <link rel="stylesheet" href="css/ecg-cdss.css">
  <script src="../shared/cdss-shell.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      background-color: var(--cdss-bg, #f8fafc);
      color: var(--cdss-text, #1e293b);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: var(--font-body, 'Inter', sans-serif);
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <!-- CliniPortal Master Navigation Bar -->
  <header class="cdss-portal-navbar">
    <div class="cdss-portal-nav-breadcrumbs">
      <a href="../index.html"><i class="fa-solid fa-microchip"></i> CDSS Platform Hub</a>
      <i class="fa-solid fa-chevron-right separator"></i>
      <span class="active"><i class="fa-solid fa-heart-pulse text-teal-600"></i> ECG Master (21 Ca Lâm Sàng &amp; AI)</span>
    </div>

    <div class="cdss-portal-nav-right">
      <a href="../index.html" class="cdss-portal-nav-btn" title="Trở về Danh Mục CDSS">
        <i class="fa-solid fa-th-large"></i> <span>Danh Mục CDSS</span>
      </a>
      <button id="theme-toggle" class="cdss-portal-theme-btn" title="Chuyển chế độ Sáng/Tối" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- Mount Point for Full ECG Application -->
  <div id="root"></div>

  <!-- ES Module Loader -->
  <script type="module">
    import { EcgCDSSController } from './ecg-bundle.js';
    if (!window.__ecg_initialized) {
      window.__ecg_initialized = true;
      new EcgCDSSController('root');
    }
  </script>

  <!-- Offline file:/// Fallback Loader -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const rootEl = document.getElementById('root');
        if (rootEl && rootEl.children.length === 0 && !window.__ecg_initialized) {
          console.info('Module blocked or pending, activating standalone IIFE bundle...');
          const s = document.createElement('script');
          s.src = './assets/ecg-app.iife.js?v=' + Date.now();
          s.onload = () => {
            const Controller = window.EcgCDSSController || (window.EcgApp && window.EcgApp.EcgCDSSController);
            if (Controller && !window.__ecg_initialized) {
              window.__ecg_initialized = true;
              new Controller('root');
            }
          };
          document.body.appendChild(s);
        }
      }, 250);
    });
  </script>
</body>
</html>
