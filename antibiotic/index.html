    <!-- Mount Point for Full React Application -->
    <div id="root"></div>

    <!-- Offline file:/// Fallback Loader -->
    <script>
      function checkAndLoadIife() {
        const rootEl = document.getElementById('root');
        if (rootEl && rootEl.children.length === 0) {
          console.info('Module pending or blocked under file:///, activating standalone IIFE bundle...');
          const s = document.createElement('script');
          s.src = './assets/antibiotic-app.iife.js?v=' + Date.now();
          document.body.appendChild(s);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(checkAndLoadIife, 150));
      } else {
        setTimeout(checkAndLoadIife, 150);
      }
    </script>
  </body>
