    <!-- Instant Theme Sync (Auto Light Mode Default & Universal Synchronization) -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          var saved = urlTheme || localStorage.getItem('cliniportal_theme') || localStorage.getItem('clinical_theme') || localStorage.getItem('theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Mount Point for Full React Application -->

    <!-- Offline file:/// Fallback Loader -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const rootEl = document.getElementById('root');
          if (rootEl && rootEl.children.length === 0) {
            console.info('Module blocked or pending under file:///, activating standalone IIFE bundle...');
            const s = document.createElement('script');
            s.src = './assets/sepsis-app.iife.js?v=' + Date.now();
            document.body.appendChild(s);
          }
        }, 300);
      });
    </script>
